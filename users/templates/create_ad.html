<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание рекламы</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 200px;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar li {
            margin-bottom: 10px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            border-radius: 5px;
            background-color: #fff;
            transition: background-color 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #ddd;
        }

        .main-content {
            flex: 1;
            padding: 20px;
        }
        .toolbar {
            margin-bottom: 10px;
        }
        button {
            margin-right: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .form-container {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
        }

        .form-input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
             box-sizing: border-box;
        }
        textarea {
            height: 200px;
        }

        .form-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-button:hover {
            background-color: #45a049;
        }

        /* Специальные стили для изображения */
        .form-input[type="file"] {
            display: none;
        }

        .upload-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #f0f0f0;
            color: #333;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .upload-button:hover {
            background-color: #ddd;
        }

        .preview-image {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 15px;
        }
         #preview {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .tg-spoiler {
            background-color: #000;
            color: #000;
            cursor: pointer;
        }
        .tg-spoiler:hover {
            color: #fff;
        }
        .tg-spoiler:active {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
        <ul>
            <li><a href="{% url 'user_list' %}">Список пользователей</a></li>
            <li><a href="{% url 'report' %}">Жалобы</a></li>
            <li><a href="{% url 'verefi' %}">Верификация пользователей</a></li>
            <li><a href="{% url 'ad_list' %}">Управление рекламой</a></li>
            <li><a href="{% url 'stat' %}">Статистика</a></li>
            <li><a href="{% url 'mailing'%}">Рассылка</a></li>
            <li><a href="{% url 'admin:index' %}">Главная админ-панель</a></li>
        </ul>
    </div>

        <div class="main-content">
            <div class="form-container">
                <h2>Создание рекламы</h2>
                <form method="post" enctype="multipart/form-data">
                    {%csrf_token%}
                    <label for="image1" class="form-label">Фотография 1:</label>
                    <input type="file" id="image1" name="image1" accept="image/*" class="form-input">
                    <button type="button" class="upload-button" onclick="document.getElementById('image1').click();">Загрузить</button>
                    <img src="#" alt="Предпросмотр изображения 1" class="preview-image" id="preview-image1">

                    <label for="image2" class="form-label">Фотография 2:</label>
                    <input type="file" id="image2" name="image2" accept="image/*" class="form-input">
                    <button type="button" class="upload-button" onclick="document.getElementById('image2').click();">Загрузить</button>
                    <img src="#" alt="Предпросмотр изображения 2" class="preview-image" id="preview-image2">

                    <label for="image3" class="form-label">Фотография 3:</label>
                    <input type="file" id="image3" name="image3" accept="image/*" class="form-input">
                    <button type="button" class="upload-button" onclick="document.getElementById('image3').click();">Загрузить</button>
                    <img src="#" alt="Предпросмотр изображения 3" class="preview-image" id="preview-image3">
                    <br>
                    <label>Время начала показа(можно пропустить): <input type="datetime-local" name="start_time"/></label>
                    <br>
                    <label>Время конца показа(можно пропустить): <input type="datetime-local" name="end_time"/></label>
                    <br>
                    <label>Нужно количество показов(можно пропустить): <input type="number" name="max_view"></label>
                    <br>
                    <label>Шанс показа в процентах: <input type="number" name="chance" value="5"></label>
                     <label for="text" class="form-label">Текст рекламы:</label>
                     <div class="toolbar">
                        <button type="button" onclick="formatText('b')"><b>Жирный</b> (b)</button>
                        <button type="button" onclick="formatText('i')"><i>Курсив</i> (i)</button>
                        <button type="button" onclick="formatText('u')"><u>Подчеркивание</u> (u)</button>
                        <button type="button" onclick="formatText('s')"><s>Зачеркнуто</s> (s)</button>
                        <button type="button" onclick="formatText('span', 'tg-spoiler')">скрытый текст (span)</button>
                        <button type="button" onclick="formatText('a', 'href', 'http://www.example.com/')">URL-адрес (a)</button>
                        <button type="button" onclick="formatText('code')"><code>Код</code> (code)</button>
<button type="button" onclick="formatText('pre', 'class', 'language-python',  '  предварительно отформатированный блок кода фиксированной ширины, \n написанный на языке программирования Python')">Пред. код Python (pre)</button>
                    </div>
                     <textarea id="text" name="text" class="form-input"  placeholder="Введите текст здесь"></textarea>
                    <button type="button" onclick="updatePreview()">Предпросмотр</button>
                    <h2>Предпросмотр:</h2>
                    <div id="preview"></div>

                    <button type="submit" class="form-button">Создать рекламу</button>
                </form>
                {% if messages %}
           <ul class="messages">
               {% for message in messages %}
                   <li>{{ message }}</li>
               {% endfor %}
           </ul>
       {% endif %}
            </div>
        </div>
    </div>

    <script>
        function handleImagePreview(inputId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(`preview-${inputId}`);

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = '#';
            }
        }

        const image1 = document.getElementById('image1');
        const image2 = document.getElementById('image2');
        const image3 = document.getElementById('image3');

        image1.addEventListener('change', function() {
            handleImagePreview('image1');
        });

        image2.addEventListener('change', function() {
            handleImagePreview('image2');
        });

        image3.addEventListener('change', function() {
            handleImagePreview('image3');
        });

        function formatText(tag, attrName = null, attrValue = null, content = null) {
            const textarea = document.getElementById('text');
            const selectionStart = textarea.selectionStart;
            const selectionEnd = textarea.selectionEnd;
            const selectedText = textarea.value.substring(selectionStart, selectionEnd);

            let formattedText = "";

            if (selectedText) {
                if (attrName && attrValue) {
                  if (tag === 'tg-emoji') {
                       formattedText = `<${tag} ${attrName}="${attrValue}">${content}</${tag}>`
                  } else{
                      formattedText = `<${tag} ${attrName}="${attrValue}">${selectedText}</${tag}>`;
                  }
                }
                else if (tag === 'span' && attrName === 'tg-spoiler')
                {
                  formattedText = `<${tag} class="${attrName}">${selectedText}</${tag}>`;
                }
                else{
                    formattedText = `<${tag}>${selectedText}</${tag}>`;
                }

            } else {
                  if (attrName && attrValue) {
                       if (tag === 'tg-emoji') {
                           formattedText = `<${tag} ${attrName}="${attrValue}">${content}</${tag}>`
                       }
                      else if (tag === 'pre' && attrName === 'class') {
                          formattedText = `<${tag}><code class="${attrValue}"> ${content} </code></${tag}>`
                      }
                      else {
                        formattedText = `<${tag} ${attrName}="${attrValue}"> </${tag}>`
                      }
                  }
                  else if (tag === 'span' && attrName === 'tg-spoiler'){
                       formattedText = `<${tag} class="${attrName}"> </${tag}>`
                  }
                  else{
                      formattedText = `<${tag}></${tag}>`
                  }

            }
            const textBefore = textarea.value.substring(0, selectionStart);
            const textAfter = textarea.value.substring(selectionEnd);

            textarea.value = textBefore + formattedText + textAfter;
            const cursorPosition = selectionStart + formattedText.length;
            textarea.focus();
            textarea.setSelectionRange(cursorPosition, cursorPosition);
        }
         function updatePreview() {
            const htmlInput = document.getElementById('text').value;
             const previewDiv = document.getElementById('preview');
             previewDiv.innerHTML = htmlInput;

               const spoilers = previewDiv.querySelectorAll('.tg-spoiler');
                spoilers.forEach(spoiler => {
                    spoiler.addEventListener('click', function() {
                    this.style.color = this.style.color === 'black' ? 'white' : 'black';
                });
                });
        }
    </script>
</body>
</html>
